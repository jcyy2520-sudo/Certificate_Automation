; Keep idle PHP processes out of a small container's memory budget.
[www]
; FPM may clear inherited variables before a request. Keep libpq's optional
; per-user certificate lookup outside the inaccessible /root directory.
env[HOME] = /var/www/html
pm = ondemand
pm.max_children = __FPM_MAX_CHILDREN__
pm.process_idle_timeout = 10s
pm.max_requests = 200

; Production PHP settings for the webinar platform container.

; Do not advertise the PHP version in response headers.
expose_php = Off

; The certificate design upload validates at max:8192 (8 MB). PHP's stock
; upload_max_filesize is 2M, which would reject a valid design with a confusing
; error long before Laravel's validator ever sees it. post_max_size must stay
; above upload_max_filesize to leave room for the rest of the form.
upload_max_filesize = 10M
post_max_size = 12M

; dompdf holds the full page plus the embedded background image in memory while
; rendering a certificate. 256M is comfortable for an 8 MB design; raise it if
; issuing starts failing on very large artwork.
memory_limit = 256M

; Web requests should never run this long — certificate work is queued. This is
; a backstop against a wedged request holding an FPM worker.
max_execution_time = 60
max_input_time = 60

; Errors are logged, never rendered. APP_DEBUG=false already governs Laravel's
; own output; this covers anything that fails before the framework boots.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; opcache: validate_timestamps=0 is safe because the image is immutable — a new
; release is a new container, never an edit in place.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The platform's edge already gzips responses; doing it twice wastes CPU
    # that certificate rendering needs.
    gzip off;

    # Never advertise the nginx version.
    server_tokens off;

    # Must exceed php.ini's post_max_size or nginx rejects a valid certificate
    # design upload with a 413 before PHP is reached.
    client_max_body_size 12M;

    # Certificate PDFs stream from a private disk through an authenticated
    # controller, so responses can be large and slow to assemble.
    fastcgi_read_timeout 120s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    server {
        # __PORT__ is replaced at container start from $PORT.
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Laravel sets its own security headers in SecurityHeaders middleware.
        # Nothing is duplicated here, so there is a single source of truth.

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Built assets are content-hashed by Vite, so they are safe to cache
        # hard. Everything else flows through PHP, which sends no-store.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Nothing outside public/ is served directly. Private certificate files
        # live on a disk with no HTTP route by design; the production preflight
        # asserts that. Never add a location block for storage/.
        location ~ /\.(?!well-known) {
            deny all;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_hide_header X-Powered-By;
        }
    }
}
